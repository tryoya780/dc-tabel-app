<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diamond Табель — редизайн, вариант A</title>
<!-- Рабочий файл редизайна: макеты экранов варианта A по пачкам на согласование. Данные демонстрационные.
     Приложение (index.html) этим файлом не затрагивается. -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--pg);color:var(--pg-tx);line-height:1.4;font-size:15px}
button{font:inherit;color:inherit}
p{margin:0}

/* ===== страница: тема ===== */
body[data-t=light]{--pg:#ECEBE8;--pg-sf:#fff;--pg-tx:#1a1a1a;--pg-mut:#625e59;--pg-ln:#d9d6d1;--frame:#1c1c1c;--tgb:#f4f4f4;--tgt:#111;--tgm:#7a7a7a;
  --ok:#1E7F4A;--warn:#A8590B;--bad:#C0362C;--gold:#B8864F}
body[data-t=dark]{--pg:#090909;--pg-sf:#151515;--pg-tx:#ededed;--pg-mut:#a39f9a;--pg-ln:#292929;--frame:#303030;--tgb:#1c1c1e;--tgt:#f2f2f2;--tgm:#8e8e93;
  --ok:#56C28A;--warn:#E2A545;--bad:#EF6E63;--gold:#C99A67}

/* ===== токены вариантов ===== */
body[data-v=a]{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--disp:var(--font);--rb:16px;--rs:12px}
body[data-v=a][data-t=light]{--bg:#fff;--sf:#fff;--sf2:#f3f3f2;--tx:#161616;--mut:#686868;--ln:#ebebea;--pri:#161616;--pri-tx:#fff;--acc:#8F5A12}
body[data-v=a][data-t=dark]{--bg:#101010;--sf:#101010;--sf2:#1d1d1d;--tx:#ededed;--mut:#9c9c9c;--ln:#262626;--pri:#ededed;--pri-tx:#101010;--acc:#C99A67}



/* ===== шапка страницы ===== */
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--pg-mut)}
.title{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 8px;font-weight:650}
.intro{color:var(--pg-mut);max-width:780px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 8px}
.vcard{text-align:left;background:var(--pg-sf);border:1px solid var(--pg-ln);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.vcard:hover{border-color:var(--pg-mut)}
.vcard[aria-pressed=true]{border-color:var(--pg-tx);box-shadow:0 0 0 1px var(--pg-tx)}
.vcard h3{margin:0 0 8px;font-size:16px}
.vcard h3 span{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:7px;background:var(--pg-tx);color:var(--pg);font-size:13px;margin-right:8px}
.vcard dl{margin:0;display:grid;gap:8px;font-size:13.5px}
.vcard dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pg-mut);margin-bottom:1px}
.vcard dd{margin:0}
.common{font-size:13.5px;color:var(--pg-mut);margin:10px 0 0}
.bar{position:sticky;top:0;z-index:5;margin:18px -20px 26px;padding:10px 20px;background:color-mix(in srgb,var(--pg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--pg-ln);display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--pg-sf);border:1px solid var(--pg-ln);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-size:14px;font-weight:550;color:var(--pg-mut);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--pg-tx)}
.seg button[aria-pressed=true]{background:var(--pg-tx);color:var(--pg)}
.seg button:focus-visible,.vcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar .grp{display:flex;align-items:center;gap:8px}.bar .lbl{font-size:12px;color:var(--pg-mut)}
.stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.cap{font-size:13px;color:var(--pg-mut);margin:0 0 10px 14px}
.notes{width:300px;flex:1 1 300px;max-width:420px;background:var(--pg-sf);border:1px solid var(--pg-ln);border-radius:14px;padding:16px 18px;font-size:13.5px;position:sticky;top:120px;margin-top:29px}
.notes h4{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--pg-mut);font-weight:600}
.notes ul{margin:0;padding-left:18px;display:grid;gap:8px}
.notes b{font-weight:600}
@media (max-width:900px){.cards{grid-template-columns:1fr}}

/* ===== телефон ===== */
.ph{width:410px;max-width:100%;border:10px solid var(--frame);border-radius:46px;overflow:hidden;background:var(--bg);box-shadow:0 20px 50px -24px rgba(0,0,0,.45)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;background:var(--tgb);color:var(--tgt);font-size:15px}
.tg b{font-weight:600;text-align:center;line-height:1.15}.tg b small{display:block;font-weight:400;font-size:11px;color:var(--tgm)}
.tg span{color:var(--tgm);width:64px}.tg span:last-child{text-align:right;letter-spacing:2px}
.scr{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:16px;line-height:1.38;font-variant-numeric:tabular-nums}
.scr.fix>div{min-height:700px;display:flex;flex-direction:column}
.grow{flex:1}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}

/* ===== общие элементы ===== */
.btn{appearance:none;border:0;font-weight:600;font-size:17px;height:56px;padding:0 16px;border-radius:var(--rb);background:var(--pri);color:var(--pri-tx);width:100%;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.985);filter:brightness(.9)}
.btn:focus-visible,.cb:focus-visible,.lnk:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn svg{width:22px;height:22px;flex:none}
.btn.sec{background:var(--sf2);color:var(--tx)}
.btn.ink{background:var(--ink,var(--pri));color:var(--ink-tx,var(--pri-tx))}
.btn.txt{background:none;color:var(--tx);height:44px;font-size:15px;font-weight:500}
.btn.sm{height:44px;font-size:15px;border-radius:var(--rs);padding:0 14px}
.btn.duo{flex-direction:column;gap:1px;height:54px;padding:0 6px;line-height:1.15;font-size:15px;border-radius:var(--rs)}
.btn.duo small{font-size:12px;font-weight:400;opacity:.72}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lnk{background:none;border:0;padding:0;color:var(--acc);font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.lnk svg{width:16px;height:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--mut)}
.brand svg{width:11px;height:11px;color:var(--gold)}
.hint{font-size:13px;color:var(--mut);text-align:center;margin-top:10px}

/* статус: один способ на вариант. A — точка и слово, B — мягкая плашка, C — квадрат и короткая подпись */
.st{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:550;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.st.ok i{background:var(--ok)}.st.warn i{background:var(--warn)}.st.bad i{background:var(--bad)}
.st.off i{background:none;box-shadow:inset 0 0 0 1.5px var(--mut)}

/* камера */
.cam{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(165deg,#44413d,#1b1a19 70%);aspect-ratio:3/4;width:100%}
.cam .sil{position:absolute;left:50%;bottom:0;width:74%;transform:translateX(-50%);fill:rgba(255,255,255,.13)}
.cam .oval{position:absolute;left:50%;top:14%;width:52%;aspect-ratio:3/4;transform:translateX(-50%);border:1.5px dashed rgba(255,255,255,.5);border-radius:50%}
.cam .stamp{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;padding:5px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.cam .live{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:4px 9px;border-radius:999px}
.cam .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff5b4f}

/* ===== A: спокойный ===== */
.a{padding:22px 24px 22px}
.a .h1{font-size:30px;line-height:1.14;letter-spacing:-.022em;font-weight:650;margin:28px 0 10px}
.a .h1.sm{font-size:25px;margin:16px 0 6px}
.a .lead{font-size:17px}
.a .lab{font-size:13px;color:var(--mut);margin-bottom:8px}
.a-last{margin-top:44px;padding-top:18px;border-top:1px solid var(--ln)}
.a-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.a-row .mut{font-size:14px;margin-top:2px}
.a-big{margin:30px 0 26px}
.a-big .num{display:block;font-size:52px;line-height:1;letter-spacing:-.035em;font-weight:650;white-space:nowrap}
.a-big .mut{display:block;margin-top:8px;font-size:16px}
.a h2.ev{font-size:19px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em}
.kv{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15.5px}
.kv span{color:var(--mut)}.kv b{font-weight:550;text-align:right}
.kv:last-child{border-bottom:0}
.a-ctx{margin:14px 0 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.a-ctx b{display:block;font-weight:600}
.a-top{display:flex;justify-content:space-between;align-items:center}
.a-acts{display:flex;gap:8px;margin:16px 0 4px}.a-acts .btn{width:auto;flex:1}.a-acts .btn.ico{flex:0 0 48px;padding:0;letter-spacing:1px}
.a-h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:34px 0 4px;display:flex;gap:8px;align-items:baseline}
.a-h2 span{color:var(--tx);letter-spacing:0;font-size:14px}
.a-q{padding:16px 0 18px;border-bottom:1px solid var(--ln)}
.a-q:last-of-type{border-bottom:0;padding-bottom:0}
.a-box{background:var(--sf2);border-radius:20px;margin:22px -12px 0;padding:0 16px 16px}.a-box .a-h2{margin-top:0;padding-top:16px}.a-box .a-q{border-color:color-mix(in srgb,var(--tx) 9%,transparent)}.a-box .btn.sec{background:var(--bg)}
.a-q .who{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:6px}
.a-q .who b{font-size:17px;font-weight:600}
.a-q p{font-size:14.5px;color:var(--mut);margin:4px 0 12px}
.a-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 10px}
.a-nums b{display:block;font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.a-nums small{font-size:13px;color:var(--mut)}
.a-cat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15.5px}
.a-cat small{display:block;color:var(--mut);font-size:13px}
.a-cat .r{text-align:right;white-space:nowrap;font-weight:550}
.a-ppl{padding:2px 0 8px 0;border-bottom:1px solid var(--ln)}
.a-ppl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0 8px 14px;font-size:14.5px}
.meter{height:4px;border-radius:2px;background:var(--sf2);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:var(--tx);border-radius:2px}
.foot{font-size:13px;color:var(--mut);text-align:center;margin-top:30px}


/* ===== пачка 2: выбор и итоговые экраны ===== */
.a-opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 0;background:none;border:0;border-bottom:1px solid var(--ln);text-align:left;cursor:pointer;font-size:17px}
.a-opt:last-of-type{border-bottom:0}
.a-opt b{display:block;font-weight:600}
.a-opt small{display:block;font-size:14px;color:var(--mut);margin-top:1px}
.a-opt .rd{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--mut);transition:box-shadow .12s}
.a-opt.on .rd{box-shadow:inset 0 0 0 7px var(--tx)}
.a-opt.full{cursor:default}.a-opt.full b,.a-opt.full small{color:var(--mut);font-weight:500}.a-opt.full .rd{opacity:.35}
.a-opt:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.stop{background:var(--bad);color:#fff}body[data-t=dark] .btn.stop{color:#1a0b09}
.a-opt .ch{margin-left:auto;color:var(--mut);display:flex}.a-opt .ch svg{width:20px;height:20px}
.a-doc{margin-top:16px;padding:16px;border-radius:16px;background:var(--sf2);font-size:15px;line-height:1.45}
.a-doc p+p{margin-top:10px}
.a-check{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:15px;cursor:pointer}
.a-check input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--mut);cursor:pointer;display:grid;place-items:center}
.a-check input:checked{background:var(--tx);box-shadow:none}
.a-check input:checked::after{content:"";width:11px;height:6px;border:2px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.a-check input:focus-visible,.a-field input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn[disabled]{opacity:.35;pointer-events:none}
.a-field{margin-top:22px}
.a-field label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
.a-field input{width:100%;height:56px;border:0;border-radius:var(--rs);background:var(--sf2);color:var(--tx);font:inherit;font-size:18px;padding:0 16px}
.a-field small{display:block;font-size:13px;color:var(--mut);margin-top:8px}
.a-tabs{display:flex;gap:24px;border-bottom:1px solid var(--ln);margin-top:18px}
.a-tabs button{background:none;border:0;padding:10px 0 11px;margin-bottom:-1px;font-size:16px;font-weight:550;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer}
.a-tabs button.on{color:var(--tx);border-color:var(--tx)}
.a-tabs button em{font-style:normal;color:var(--warn);margin-left:5px}
.a-ib{width:44px;height:44px;margin:-10px -10px -10px 0;border:0;background:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx)}
.a-ib svg{width:22px;height:22px}
.a-ev{display:block;width:100%;text-align:left;background:var(--sf2);border:0;border-radius:18px;padding:14px 16px 16px;margin-top:8px;cursor:pointer;transition:filter .15s}
.a-ev:active{filter:brightness(.96)}.a-ev:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.a-evs{margin:14px -8px 0}.a-mon+.a-evs{margin-top:4px}
.st.fill i{background:none;box-shadow:inset 0 0 0 1.5px var(--tx);animation:fillp 1.6s ease-in-out infinite}
@keyframes fillp{0%,100%{box-shadow:inset 0 0 0 1.5px var(--tx)}50%{box-shadow:inset 0 0 0 4px var(--tx)}}
@media (prefers-reduced-motion:reduce){.st.fill i{animation:none}}
.a-ev .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.a-ev .h b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.a-ev .m{font-size:14px;color:var(--mut);margin-top:3px}
.a-ev .meter{margin:12px 0 0;height:3px;background:color-mix(in srgb,var(--tx) 10%,transparent)}
.a-ev .sum{white-space:nowrap;font-weight:600;font-size:15.5px}
.a-chips{display:flex;gap:6px;margin:16px -24px 0;padding:0 24px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.a-chips::-webkit-scrollbar{display:none}.a-chips button{flex:none;white-space:nowrap}
.a-chips button{border:0;background:var(--sf2);color:var(--mut);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:550;cursor:pointer}
.a-chips button.on{background:var(--tx);color:var(--bg)}
.a-grp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:16px}
.a-grp{width:100%;background:none;border:0;text-align:left;cursor:pointer;padding-left:0;padding-right:0}.a-who{display:inline-flex;align-items:center;gap:2px}.a-grp b svg{display:inline-block;vertical-align:-3px;margin-left:2px}.a-grp svg,.a-who svg{width:16px;height:16px;color:var(--mut);flex:none}
.a-who{background:none;border:0;padding:0;cursor:pointer;font-size:17px;font-weight:600;color:var(--tx);text-align:left}.a-grp:focus-visible,.a-who:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.a-grp b{font-size:15.5px;font-weight:600}.a-grp span{font-size:13px;color:var(--mut);white-space:nowrap}
.a-box.fl{margin-top:14px}.a-box.fl .a-q{padding-top:14px}
.a-q .who .pay{text-align:right;white-space:nowrap;font-size:14.5px;font-weight:600}
.a-search{position:relative;margin-top:16px}
.a-search svg{position:absolute;left:14px;top:14px;width:20px;height:20px;color:var(--mut)}
.a-search input{width:100%;height:48px;border:0;border-radius:var(--rs);background:var(--sf2);color:var(--tx);font:inherit;padding:0 14px 0 44px}
.a-search input::placeholder{color:var(--mut)}
.a-mon{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 0;font-size:13px;color:var(--mut)}
.a-mon b{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.a-sh{background:color-mix(in srgb,#000 46%,var(--bg))}
body[data-t=dark] .a-sh{background:#000}
.a-dim{flex:1 0 64px;padding:20px 24px 0;color:color-mix(in srgb,var(--bg) 55%,transparent);font-size:17px;font-weight:600}
body[data-t=dark] .a-dim{color:#3a3a3a}
.a-sheet{border-radius:26px 26px 0 0;padding-top:10px;background:var(--bg);display:flex;flex-direction:column}
.a-sheet.full{flex:1 1 auto;min-height:636px}
body[data-t=dark] .a-sheet{box-shadow:0 -1px 0 #2e2e2e;background:#161616}
.a-grip{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
.a-shh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.a-shh h1{font-size:23px;line-height:1.2;letter-spacing:-.02em;font-weight:650;margin:0 0 3px}
.a-x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--sf2);color:var(--mut);font-size:20px;line-height:1;cursor:pointer}
.a-pics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.a-pic{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:linear-gradient(165deg,#44413d,#1b1a19 70%);border:0;padding:0;cursor:pointer}
.a-pic svg{position:absolute;left:50%;bottom:0;width:62%;transform:translateX(-50%);fill:rgba(255,255,255,.14)}
.a-pic span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:3px 8px;border-radius:7px}
.a-pic.tap{aspect-ratio:auto;height:84px;background:var(--sf2);color:var(--tx);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:0 14px 0 50px;text-align:left}.a-pic.tap svg{position:absolute;left:14px;top:50%;bottom:auto;width:24px;height:24px;transform:translateY(-50%);fill:none;color:var(--mut)}.a-pic.tap b{font-size:15px;font-weight:600}.a-pic.tap small{font-size:13px;color:var(--mut)}.a-pic.no{aspect-ratio:auto;height:84px;padding:0 12px;text-align:center;background:var(--sf2);cursor:default;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut)}
.a-sub{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:26px 0 2px}
.btn.txt.red{color:var(--bad)}
.a-field textarea{width:100%;min-height:104px;border:0;border-radius:var(--rs);background:var(--sf2);color:var(--tx);font:inherit;font-size:17px;padding:14px 16px;resize:none;display:block}
.a-field textarea::placeholder{color:var(--mut)}

const QR=(()=>{const n=25,c=[];let v=7;const fin=(x,y)=>[[0,0],[n-7,0],[0,n-7]].some(([a,b])=>x>=a&&x<a+7&&y>=b&&y<b+7&&(x===a||x===a+6||y===b||y===b+6||(x>=a+2&&x<=a+4&&y>=b+2&&y<=b+4)));
  const inF=(x,y)=>[[0,0],[n-8,0],[0,n-8]].some(([a,b])=>x>=a&&x<a+8&&y>=b&&y<b+8);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){v=(v*1103515245+12345)%2147483648;if(inF(x,y)?fin(x,y):v%100<46)c.push('<rect x="'+x+'" y="'+y+'" width="1" height="1"/>')}
  return '<svg viewBox="0 0 '+n+' '+n+'" fill="#111" shape-rendering="crispEdges">'+c.join('')+'</svg>'})();

/* ===== пачки ===== */
const BATCH=[
 {t:'1 · Главная, селфи, карточка мероприятия',ok:1,note:'Согласовано 05.10. Главная сотрудника в двух состояниях, селфи после QR, карточка мероприятия администратора.',frames:()=>A.home().concat(A.selfie(),A.admin()),fix:i=>i<3},
 {t:'2 · Категория, время вызова, после селфи',ok:1,note:'Согласовано 05.10. Выбор категории и времени вызова показывается, только если их нельзя определить автоматически. Категория и время выбираются одним касанием. После селфи на входе человек сразу попадает на главную с открытой сменой; после селфи на выходе видит итог смены.',frames:()=>P2,fix:()=>true},
 {t:'3 · Согласие, номер, ФИО',ok:1,note:'Согласовано 05.10. Эти экраны человек видит один раз: согласие при первом открытии, номер и ФИО — перед первым селфи.',frames:()=>P3,fix:()=>true},
 {t:'4 · Консоль: мероприятия, флаги, архив',ok:1,note:'Согласовано 05.10. Три экрана консоли администратора: список мероприятий, вкладка «Флаги» и архив.',frames:()=>P4,fix:()=>true},
 {t:'5 · Человек, категория, подтверждения',ok:1,note:'Согласовано 05.10. Всё это открывается шторкой снизу поверх карточки мероприятия: карточка человека в двух состояниях, панель категории и три окна действий.',frames:()=>P5,fix:()=>true},
 {t:'6 · Наряд, мероприятие, выплаты, QR, отчёт',ok:1,note:'Согласовано 05.10. Последняя пачка: экран наряда, форма нового мероприятия, выплаты наличными, QR-лист и отчёт.',frames:()=>P6,fix:()=>true}
];
const S={b:BATCH.length-1,t:'light'};
(location.hash.slice(1).split('-')).forEach((x,i)=>{if(i===0&&BATCH[+x-1])S.b=+x-1;if(i===1&&(x==='light'||x==='dark'))S.t=x});
document.getElementById('seg-b').innerHTML=BATCH.map((b,i)=>'<button data-b="'+i+'">'+b.t+(b.ok?' ✓':'')+'</button>').join('');
function phone(cap,html,fix){return '<div><p class="cap">'+cap+'</p><div class="ph"><div class="tg"><span>Закрыть</span><b>Diamond Табель<small>мини-приложение</small></b><span>•••</span></div><div class="scr'+(fix?' fix':'')+'">'+html+'</div></div></div>'}
function draw(){
  document.body.dataset.t=S.t;
  document.querySelectorAll('#seg-b button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.b===S.b)));
  document.querySelectorAll('#seg-t button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===S.t)));
  const B=BATCH[S.b];
  document.getElementById('bnote').textContent=B.note;
  document.getElementById('stage').innerHTML=B.frames().map((f,i)=>phone(f[0],f[1],B.fix(i))).join('');
  try{history.replaceState(null,'','#'+(S.b+1)+'-'+S.t)}catch(e){}
}
document.addEventListener('click',e=>{
  const o=e.target.closest('.a-opt');
  if(o)return;
  if(e.target.matches('.a-check input')){const b=e.target.closest('.a').querySelector('[data-need]');if(b)b.disabled=!e.target.checked;return}
  const b=e.target.closest('.seg button');if(!b)return;
  if(b.dataset.b)S.b=+b.dataset.b;if(b.dataset.t)S.t=b.dataset.t;draw();
});
draw();
</script>
